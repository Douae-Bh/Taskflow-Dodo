<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - TaskFlow</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg) 0%, #1a1f3d 100%);
      padding: 2rem;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .auth-logo { text-align: center; margin-bottom: 2rem; }
    .auth-logo span { font-size: 2.5rem; }
    .auth-logo h1 {
      font-size: 1.5rem;
      margin-top: 0.5rem;
      background: linear-gradient(135deg, var(--primary), #a78bfa);
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .btn-submit {
      width: 100%;
      padding: 0.875rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 1rem;
    }
    .btn-submit:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    .auth-footer a { color: var(--primary); font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }
    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.75rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
    }
    .error-msg.show { display: block; }
    .success-msg {
      background: rgba(34,197,94,0.1);
      border: 1px solid var(--success);
      color: var(--success);
      padding: 0.75rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
    }
    .success-msg.show { display: block; }
    .input-group { position: relative; }
    .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.4;
      font-size: 1rem;
    }
    .input-group .form-input { padding-left: 2.5rem; }
    .password-strength {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
    }
    .password-strength-bar {
      height: 100%;
      width: 0%;
      transition: all 0.3s;
      border-radius: 2px;
    }
    .password-strength-text {
      font-size: 0.75rem;
      margin-top: 0.25rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <span>⚡</span>
        <h1>TaskFlow</h1>
        <p style="color:var(--text-muted);font-size:0.875rem;margin-top:0.25rem">Créez votre compte gratuitement</p>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg"></div>

      <form id="registerForm">
        <div class="form-group">
          <label>Nom complet</label>
          <div class="input-group">
            <span class="input-icon">👤</span>
            <input type="text" class="form-input" id="fullName" placeholder="Jean Dupont" required>
          </div>
        </div>
        <div class="form-group">
          <label>Adresse email</label>
          <div class="input-group">
            <span class="input-icon">📧</span>
            <input type="email" class="form-input" id="email" placeholder="vous@exemple.com" required>
          </div>
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <div class="input-group">
            <span class="input-icon">🔒</span>
            <input type="password" class="form-input" id="password" placeholder="Min. 6 caractères" required minlength="6">
          </div>
          <div class="password-strength">
            <div class="password-strength-bar" id="strengthBar"></div>
          </div>
          <div class="password-strength-text" id="strengthText"></div>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Créer mon compte</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Déjà un compte ? <a href="login.html">Se connecter</a></p>
      </div>
    </div>
  </div>

  <script src="../utils/api.js"></script>
  <script src="../utils/auth.js"></script>
  <script src="../utils/storage.js"></script>
  <script src="../utils/guards.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    // Si déjà connecté → redirige directement vers le dashboard
    (async () => {
      if (localStorage.getItem('token')) {
        const valid = await auth.restoreSession();
        if (valid) window.location.href = 'dashboard.html';
      }
    })();
  </script>
</body>
</html>
